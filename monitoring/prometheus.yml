# Prometheus Configuration for SECOM ML Pipeline
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'secom-ml-pipeline'
    environment: 'development'

rule_files:
  - 'alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # Producer metrics
  - job_name: 'secom-producer'
    static_configs:
      - targets: ['producer:8000']
        labels:
          service: 'producer'
          component: 'data_generation'
          environment: 'development'

  # Consumer metrics
  - job_name: 'secom-consumer'
    static_configs:
      - targets: ['consumer:8001']
        labels:
          service: 'consumer'
          component: 'data_processing'
          environment: 'development'

  # Inference metrics
  - job_name: 'secom-inference'
    static_configs:
      - targets: ['inference:8002']
        labels:
          service: 'inference'
          component: 'ml_inference'
          environment: 'development'

  # Retrainer metrics
  - job_name: 'secom-retrainer'
    static_configs:
      - targets: ['retrainer:8003']
        labels:
          service: 'retrainer'
          component: 'ml_training'
          environment: 'development'

  # PostgreSQL metrics (requires postgres_exporter)
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'database'
  #         environment: 'development'

  # Kafka metrics
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']
        labels:
          service: 'kafka'
          component: 'message_queue'
          environment: 'development'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
