apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secom-ingress
  namespace: secom-ml-pipeline
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - secom-ml.example.com
    secretName: secom-tls-secret
  rules:
  - host: secom-ml.example.com
    http:
      paths:
      - path: /inference
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8002
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
