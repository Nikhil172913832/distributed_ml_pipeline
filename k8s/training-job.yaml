apiVersion: batch/v1
kind: Job
metadata:
  name: distributed-training
  namespace: ml-pipeline
spec:
  parallelism: 4
  completions: 4
  template:
    metadata:
      labels:
        app: distributed-training
        component: worker
    spec:
      restartPolicy: OnFailure
      containers:
      - name: trainer
        image: your-registry/ml-pipeline-trainer:latest
        imagePullPolicy: Always
        command:
          - "python3"
          - "pipeline/model_trainer.py"
        env:
        - name: WORLD_SIZE
          value: "4"
        - name: RANK
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
        - name: MASTER_ADDR
          value: "distributed-training-0"
        - name: MASTER_PORT
          value: "29500"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ml-pipeline-secrets
              key: database-username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ml-pipeline-secrets
              key: database-password
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"
          requests:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "2"
        volumeMounts:
        - name: training-data
          mountPath: /data
        - name: model-checkpoints
          mountPath: /checkpoints
        - name: logs
          mountPath: /logs
        - name: config
          mountPath: /app/config
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data-pvc
      - name: model-checkpoints
        persistentVolumeClaim:
          claimName: model-checkpoints-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: logs-pvc
      - name: config
        configMap:
          name: ml-pipeline-config
      nodeSelector:
        accelerator: nvidia-tesla-v100
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
