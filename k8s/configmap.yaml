apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-pipeline-config
  namespace: ml-pipeline
data:
  config.yaml: |
    # Model Configuration
    model:
      model_name: "secom_classifier"
      version: "1.0.0"
      architecture: "logistic_regression"
      num_classes: 2
      pretrained: false

    # Distributed Training Configuration
    distributed:
      num_workers: 4
      backend: "nccl"
      init_method: "env://"
      world_size: 4
      master_addr: "distributed-training-master"
      master_port: "29500"

    # Data Pipeline Configuration
    data:
      dataset_path: "/data/"
      batch_size: 64
      num_workers: 4
      pin_memory: true
      train_split: 0.8
      val_split: 0.1
      test_split: 0.1

    # Training Configuration
    training:
      epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001
      use_amp: true
      gradient_accumulation_steps: 2
      max_grad_norm: 1.0
      warmup_epochs: 5
      scheduler_type: "cosine"
      optimizer: "adamw"

    # Monitoring Configuration
    monitoring:
      enable_mlflow: true
      enable_prometheus: true
      log_level: "INFO"
      log_interval: 10
      checkpoint_dir: "/checkpoints"
      log_dir: "/logs"

  kafka_config: |
    KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    KAFKA_TOPIC=ml_data

  database_config: |
    DATABASE_HOST=postgres
    DATABASE_PORT=5432
    DATABASE_NAME=ml_pipeline
