[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ml-pipeline"
version = "1.0.0"
description = "MLOps system for semiconductor manufacturing quality control with real-time inference and continuous learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["mlops", "machine-learning", "kafka", "continuous-learning", "drift-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "sdv>=1.8.0,<2.0.0",
    "kafka-python>=2.0.2,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "loguru>=0.7.0,<1.0.0",
    "prometheus-client>=0.18.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "redis>=5.0.0,<6.0.0",
    "mlflow>=2.9.0,<3.0.0",
    "great-expectations>=0.18.0,<1.0.0",
    "shap>=0.44.0,<1.0.0",
    "apscheduler>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "black>=23.10.0,<24.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.6.0,<2.0.0",
    "pre-commit>=3.5.0,<4.0.0",
    "httpx>=0.25.0,<1.0.0",
]

benchmark = [
    "locust>=2.17.0,<3.0.0",
]

docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.4.0,<10.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/distributed_ml_pipeline"
Documentation = "https://github.com/yourusername/distributed_ml_pipeline/blob/main/README.md"
Repository = "https://github.com/yourusername/distributed_ml_pipeline"
Issues = "https://github.com/yourusername/distributed_ml_pipeline/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "config*", "monitoring*", "models*"]
exclude = ["tests*", "benchmarks*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=pipeline --cov=config --cov=monitoring --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pipeline", "config", "monitoring"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "kafka.*",
    "sdv.*",
    "great_expectations.*",
    "shap.*",
]
ignore_missing_imports = true
