version: '3.8'

services:
  # Kafka in KRaft mode (no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ml_pipeline
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL with persistent storage
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_password}
      POSTGRES_DB: ${POSTGRES_DB:-secom_pipeline}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - ml_pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ml_user} -d ${POSTGRES_DB:-secom_pipeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI for monitoring (optional but useful)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
    depends_on:
      - kafka
    networks:
      - ml_pipeline
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin for database management (optional but useful)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@secom.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ml_pipeline
    depends_on:
      - postgres

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - ml_pipeline

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - ml_pipeline
    depends_on:
      - prometheus

  # Redis for caching and state management
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ml_pipeline
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: Dockerfile.services
    container_name: secom-producer
    command: python pipeline/producer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: secom-raw-data
      BATCH_SIZE: 100
      GENERATION_INTERVAL_SECONDS: 5
      SECOM_DATA_PATH: /data/secom.data
      SECOM_LABELS_PATH: /data/secom_labels.data
      ENABLE_DRIFT: "true"
      PROMETHEUS_PORT: 8000
      LOG_LEVEL: INFO
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    networks:
      - ml_pipeline
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: python pipeline/consumer.py
    container_name: secom-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_TOPIC: secom-raw-data
      KAFKA_CONSUMER_GROUP: secom-preprocessor-group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-secom_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-ml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_password}
      PREPROCESSING_PIPELINE_PATH: /app/models/preprocessing_pipeline.joblib
      PROMETHEUS_PORT: 8001
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - ml_pipeline
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: python pipeline/inference.py
    container_name: secom-inference
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-secom_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-ml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_password}
      INFERENCE_BATCH_SIZE: 100
      INFERENCE_POLL_INTERVAL: 5
      CONFIDENCE_THRESHOLD: 0.7
      ACCURACY_THRESHOLD: 0.85
      F1_THRESHOLD: 0.80
      DEGRADATION_TOLERANCE: 0.05
      DRIFT_DETECTION_ENABLED: "true"
      DRIFT_CHECK_INTERVAL_HOURS: 6
      KS_TEST_THRESHOLD: 0.05
      DRIFT_SCORE_THRESHOLD: 0.3
      BASELINE_DAYS: 7
      INFERENCE_PROMETHEUS_PORT: 8002
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - ml_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  retrainer:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: python pipeline/retrainer.py
    container_name: secom-retrainer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-secom_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-ml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_password}
      RETRAINER_CHECK_INTERVAL: 300
      RETRAINER_AUTO_DEPLOY: "true"
      MAX_CONCURRENT_TRAINING: 1
      RETRAINING_COOLDOWN_HOURS: 6
      RETRAINER_PROMETHEUS_PORT: 8003
      LOG_LEVEL: INFO
      # Training config
      TRAIN_TEST_SPLIT: 0.2
      RANDOM_STATE: 42
      CV_FOLDS: 5
      N_JOBS: -1
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - ml_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.services
    command: python pipeline/api_service.py
    container_name: secom-api
    ports:
      - "8004:8004"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-secom_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-ml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml_password}
      API_PORT: 8004
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - ml_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  ml_pipeline:
    driver: bridge

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  redis_data:
    driver: local
